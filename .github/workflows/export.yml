name: Export

# Called only after the caller has passed repository and headless gates.
on:
  workflow_call:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64

jobs:
  export:
    name: Export ${{ matrix.target }} build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux, macos, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Download Godot
        shell: bash
        run: |
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/SHA512-SUMS.txt" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/SHA512-SUMS.txt"
          expected="$(awk -v name="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" '$2 == name || $2 == "*" name { print $1; exit }' "$RUNNER_TEMP/SHA512-SUMS.txt")"
          actual="$(sha512sum "$RUNNER_TEMP/godot.zip" | awk '{ print $1 }')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::SHA512 mismatch for Godot engine download"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_BIN}"

      - name: Install export templates
        shell: bash
        run: |
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/SHA512-SUMS.txt" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/SHA512-SUMS.txt"
          expected="$(awk -v name="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" '$2 == name || $2 == "*" name { print $1; exit }' "$RUNNER_TEMP/SHA512-SUMS.txt")"
          actual="$(sha512sum "$RUNNER_TEMP/export_templates.tpz" | awk '{ print $1 }')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::SHA512 mismatch for Godot export templates download"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/export_templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          cp -R "$RUNNER_TEMP/export_templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"

      - name: Export and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GODOT="$RUNNER_TEMP/godot/${GODOT_BIN}" python3 scripts/tools/build_release.py "$TARGET"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: builds/release/*
          if-no-files-found: error
          retention-days: 14
