name: Release

on:
  push:
    tags: ["alpha-v*", "v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Require tag to match project version
        id: version
        run: |
          version="$(python3 scripts/tools/release_version.py --tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate-tag]
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Require complete file attachments
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          test -f "release/Camiel-${VERSION}-windows.zip"
          test -s "release/Camiel-${VERSION}-windows.zip"
          test -f "release/Camiel-${VERSION}-linux.tar.gz"
          test -s "release/Camiel-${VERSION}-linux.tar.gz"
          test -f "release/Camiel-${VERSION}-macos.zip"
          test -s "release/Camiel-${VERSION}-macos.zip"
          test -f "release/Camiel-${VERSION}-web.zip"
          test -s "release/Camiel-${VERSION}-web.zip"
          test "$(find release -type f | wc -l)" -eq 4

      - name: Create or update the single release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-tag.outputs.version }}
          prerelease: ${{ startsWith(needs.validate-tag.outputs.version, 'alpha-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Camiel-${{ needs.validate-tag.outputs.version }}-windows.zip
            release/Camiel-${{ needs.validate-tag.outputs.version }}-linux.tar.gz
            release/Camiel-${{ needs.validate-tag.outputs.version }}-macos.zip
            release/Camiel-${{ needs.validate-tag.outputs.version }}-web.zip
