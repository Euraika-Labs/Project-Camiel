name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python test dependencies
        shell: bash
        run: |
          python3 -m pip install --quiet PyYAML

      - name: Test quality gate
        shell: bash
        run: |
          python3 -m unittest tests.test_quality_gate tests.test_ci_workflows tests.test_release_build tests.test_web_export tests.test_parent_dashboard tests.test_voice_assets

      - name: Run AI quality gate
        shell: bash
        run: |
          python3 scripts/tools/quality_gate.py --root .

      - name: Check tracked file sizes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          limit = 95 * 1024 * 1024
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          too_large = []
          for path in files:
              if os.path.isfile(path):
                  size = os.path.getsize(path)
                  if size > limit:
                      too_large.append((path, size))

          for path, size in too_large:
              print(f"::error file={path}::Tracked file is {size} bytes; keep binaries in GitHub Releases.")

          if too_large:
              sys.exit(1)
          PY

      - name: Check for conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!.godot' ':!tmp' ':!builds'; then
            echo "::error::Conflict markers found."
            exit 1
          fi

  verify-godot:
    name: Verify Godot project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - repository-hygiene

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Download Godot
        shell: bash
        run: |
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --show-error --location --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/SHA512-SUMS.txt" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/SHA512-SUMS.txt"
          expected="$(awk -v name="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" '$2 == name || $2 == "*" name { print $1; exit }' "$RUNNER_TEMP/SHA512-SUMS.txt")"
          actual="$(sha512sum "$RUNNER_TEMP/godot.zip" | awk '{ print $1 }')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::SHA512 mismatch for Godot engine download"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_BIN}"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Test headless error detection
        run: GODOT="$RUNNER_TEMP/godot/${GODOT_BIN}" bash scripts/tools/test_headless_check.sh

      - name: Run headless project check
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/${GODOT_BIN}" bash scripts/tools/run_headless_check.sh

  export-builds:
    needs: [verify-godot]
    uses: ./.github/workflows/export.yml

  export-windows:
    # Preserve the required branch-protection context across reusable workflows.
    name: Export Windows build
    needs: [export-builds]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful exports
        env:
          EXPORT_RESULT: ${{ needs.export-builds.result }}
        run: |
          if [ "$EXPORT_RESULT" != "success" ]; then
            echo "::error::Required exports did not succeed: $EXPORT_RESULT"
            exit 1
          fi
